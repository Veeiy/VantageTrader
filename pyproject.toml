[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-trader"
version = "0.1.0"
description = "Calendar spread bot for tastytrade"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.45.0",
]

[project.scripts]
vantage-trader = "vantage_trader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
