# Earnings vol engine config (vantage_trader.earnings). Every key is optional;
# omitted keys use the defaults shown here. Unknown keys are rejected (exit 2).
# HARD CAPS are enforced in code: values here may only TIGHTEN them.
# All percentages are fractions (0.12 = 12%). Money in USD.

# --- universe / filters ---
blocklist: [TSLA]            # TSLA is always added even if removed here
min_price: 10.0              # HARD FLOOR >= 10. Skip if spot < this
max_spread_pct: 0.25         # HARD CAP <= 0.25 (v1.1). Skip if ATM call, put or straddle (ask-bid)/mid > this
wide_spread_pct: 0.12        # HARD CAP <= 0.12. Above this spread ...
wide_spread_max_loss: 350.0  # HARD CAP <= 350. ... the trade's max loss is capped at this (v1.1)
max_intraday_move: 0.05      # skip if |intraday_move| on entry day > this ...
max_intraday_move_sector: 0.07  # ... unless <= this with a same-direction sector move and no stock news
regime_mult: 1.25            # regime guard: 20-session avg |daily move| must be < this x avg earnings move

# --- scoring ---
straddle_factor: 0.85        # implied_move = factor * ATM straddle mid / spot
min_history: 4               # need at least this many historical moves
history_lookback: 12         # use the last N historical moves (chronological list)
sell_max_ratio: 0.85         # edge_ratio <= this -> sell premium (iron fly); bounds [0.70, 0.95]
tight_max_ratio: 0.70        # edge_ratio <= this -> band "tight" (may be entered early, v1.5)
near_miss_max_ratio: 1.10    # HARD CAP <= 1.10 (v1.10). Above sell_max_ratio and up to this: band "near_miss",
                             # traded at near_miss_size_frac of the name target and name cap.
                             # Set it equal to sell_max_ratio to switch the tier off.
near_miss_size_frac: 0.5     # HARD CAP <= 0.5 (v1.10)
buy_min_ratio: 1.25          # edge_ratio >= this -> NO TRADE "long_straddle_off" (P010); bounds [1.15, 1.60]
min_ev_per_dollar_risk: 0.0  # require historical EV / max loss strictly above this

# --- structures ---
wing_widths_pct: [0.05, 0.075, 0.10, 0.125]   # iron fly wing candidates as fraction of spot

# --- risk / sizing ---
# No limit on the number of open positions or trades per day (v1.4): the total risk cap is the limit.
# v1.11 (owner, 2026-11-13: "I want you to be able to use the entire funds in the mcp account. I
# allocated funds specifically for you to trade with."): the TOTAL cap across all open positions,
# max loss plus exit reserves, is the whole account value.
max_loss_abs: null           # no dollar ceiling. A number here puts one back (the smaller of the two applies).
max_loss_bp_frac: 1.0        # HARD CAP <= 1.0: share of account value that may be at risk
# v1.7 (owner 2026-11-11: more contracts per name and scaling in are allowed): size by risk.
max_quantity: 10             # HARD CAP <= 10. Most contracts one name may hold.
name_risk_frac: 0.20         # HARD CAP <= 0.27. Max loss one name should carry, as a share of account value
                             # (v1.8, owner 2026-11-11: "start putting the money to work"; was 0.12).
name_risk_cap: 350.0         # HARD CAP <= 350. Max loss per name at the credit floor (owner limit).
early_tranche_frac: 0.5      # share of the name target that may be entered before the final window
add_center_frac: 0.25        # an add needs spot within this x body straddle of the body strike
exit_buyback_mult: 1.1       # HARD FLOOR >= 1.0. One in-the-money short leg at the wing (x width x 100) must fit the buying power left after entry (v1.9)
final_window_start: "11:30 America/Los_Angeles"   # from here a name may be entered at full size
exit_slippage_reserve: 50.0  # USD per unit, [0, 100]. Entry: max_loss_worst <= cap - reserve*qty.
                             # Exit: credit-structure closing debit may reach W + reserve/100.

# --- order pricing ---
tick: 0.05
step_small: 0.05             # limit_step when price < step_threshold
step_large: 0.10             # limit_step otherwise
step_threshold: 3.0
credit_floor_mid_frac: 0.92  # credit floor >= this * mid
debit_ceiling_mid_frac: 1.06 # debit ceiling <= this * mid
cancel_by: "12:50 America/Los_Angeles"   # any tz allowed; converted to PT and must be <= 12:50 PT

# --- circuit breaker ---
min_account_value: 400.0     # HARD FLOOR >= 400. Halt new entries below this total_value
max_consecutive_max_loss: 2  # HARD CAP <= 2. Halt after this many consecutive max-loss trades
max_consecutive_losses: 3    # HARD CAP <= 3. Halt after this many losing trades in a row
max_loss_tolerance: 0.90     # a loss >= this * trade max_loss counts as a max-loss trade
circuit_reset_ts: null       # ISO ts; streaks only count trades closed at/after it (human resume)

# --- exits ---
exit_min_minutes_since_open: 10
straddle_take_profit: 0.50   # long straddle up >= 50% -> exit immediately
market_timezone: America/New_York

# --- calibration ---
calibrate_min_trades: 8
calibrate_prior_weight: 8    # shrink weight = n / (n + prior_weight)
sell_max_ratio_bounds: [0.70, 0.95]
buy_min_ratio_bounds: [1.15, 1.60]

# --- calendar ---
market_holidays:             # NYSE full closures; used to find the next trading day (BMO entries)
  - "2026-01-01"
  - "2026-01-19"
  - "2026-02-16"
  - "2026-04-03"
  - "2026-05-25"
  - "2026-06-19"
  - "2026-07-03"
  - "2026-09-07"
  - "2026-11-26"
  - "2026-12-25"
  - "2027-01-01"
  - "2027-01-18"
  - "2027-02-15"
  - "2027-03-26"
  - "2027-05-31"
  - "2027-06-18"
  - "2027-07-05"
  - "2027-09-06"
  - "2027-11-25"
  - "2027-12-24"
market_early_closes:         # 13:00 ET closes; entries never use an expiry on these days
  - "2026-11-27"
  - "2026-12-24"
  - "2027-11-26"
  - "2027-12-24"
max_expiry_days_after_report: 7   # entry expiry must be <= report_date + this many calendar days

# --- paths ---
journal_path: state/earnings/journal.jsonl
