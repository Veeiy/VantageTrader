# VantageTrader - 0DTE Calendar Spread Bot
#
# Strategy: pure horizontal calendar spreads at (or near) ATM, where the
# short leg expires SAME DAY (0DTE). The long leg provides collateral and
# slow-decay vega; we harvest the much steeper 0DTE theta on the short.
#
#   LONG  1x option  K  T_long  (configurable, default 30-60 DTE)
#   SHORT 1x option  K  T_short = today (0 DTE)
#
# Direction (call vs put calendar) is picked per underlying so the short
# stays OTM at entry, which minimises pin/assignment risk.

environment: sandbox          # sandbox | live
dry_run: true                 # true => log trades only, never submit (RECOMMENDED while validating)

# Universe: liquid, 0DTE-listed underlyings. Outside SPY/QQQ/IWM/SPX/major
# single names, 0DTE chains are thin or unavailable -- pick carefully.
underlyings:
  - SPY
  - QQQ
  - IWM

entry:
  # Short DTE: 0 means same-day expirations. Bot will pick today's expiration
  # if listed for the underlying; otherwise it skips.
  short_dte_min: 0
  short_dte_max: 0

  # Long leg DTE range. Wider = more vega, more cost. 30-60 is the sweet spot.
  long_dte_min: 30
  long_dte_max: 60

  # Strike selection by target delta on the SHORT leg.
  #   - 0.40-0.55 => ATM (captures max theta; max P/L if pinned)
  #   - 0.20-0.30 => slightly OTM (lower premium, less pin risk)
  # The bot picks the listed strike whose 0DTE delta on the chosen side falls
  # inside this band, closest to the band midpoint.
  short_delta_min: 0.40
  short_delta_max: 0.55

  # Direction selection
  #   auto  - if spot < target strike use calls, else puts (keeps short OTM)
  #   call  - calls only
  #   put   - puts only
  #   both  - allow both sides for the same underlying (best score wins)
  direction: auto

  # Quality filters
  max_debit_per_spread: 250        # max $ debit per 1-lot spread
  min_open_interest_short: 500
  min_open_interest_long: 100
  max_bid_ask_spread_pct: 0.15
  iv_rank_max: 60                  # calendars are long vega; prefer lower IV
  skip_if_earnings_within_days: 2  # 0DTE inside earnings = roulette
  min_theta_per_dollar: 0.0005     # daily |theta| / debit; reject low-efficiency setups

management:
  profit_target_pct: 0.25      # close spread at +25% of debit paid
  stop_loss_pct: 0.50          # close spread at -50% of debit paid
  # On a 0DTE short, "rolling" means closing today's short and selling
  # tomorrow's 0DTE in the morning. We close at this minutes-to-close.
  close_short_minutes_before_close: 15
  # Underlying drift: close if it moves this many strikes away from K.
  underlying_drift_strikes: 2
  # Close the long if it's getting too short-dated for theta value.
  close_long_at_dte: 14

risk:
  max_concurrent_spreads: 3
  max_total_debit: 1000
  max_spreads_per_underlying: 1

schedule:
  manage_every_seconds: 30
  # Enter only once per day; recommended after first 30 min of trading
  # so 0DTE opening volatility settles.
  entry_window_start: "10:00"
  entry_window_end:   "11:30"

# Optional: Claude Managed Agents that advise the trading engine.
# Disabled by default. Requires ANTHROPIC_API_KEY in the environment.
# See https://platform.claude.com/docs/en/managed-agents/quickstart
agents:
  enabled: false                  # master switch for the whole agent team

  # Where the agent's tool calls execute. Anthropic always hosts the model and
  # orchestration; this controls where bash/file ops/etc. actually run.
  #
  #   cloud       - Anthropic-managed sandbox container. Easiest path; no extra
  #                 setup. Tool inputs/outputs cross the public internet to
  #                 their cloud.
  #   self_hosted - Tool calls run on YOUR host via a long-running worker
  #                 process (`python -m vantage_trader worker`). Agent code,
  #                 filesystem, and network egress stay on your machine.
  #                 Requires ANTHROPIC_ENVIRONMENT_ID and ANTHROPIC_ENVIRONMENT_KEY
  #                 in .env. See README "Running agents locally".
  environment:
    type: cloud                   # cloud | self_hosted
    id: null                      # reuse an existing env id, or null to create one on first use
    networking: unrestricted      # cloud only: networking policy for the sandbox
    workdir: "./workspace"        # self_hosted only: where the worker runs tool calls

  # Trade Reviewer: second-opinion on each candidate that passes the rule-based
  # filters, BEFORE the order is submitted. Adds 1 LLM call per open (0-3/day
  # in practice, bounded by risk.max_concurrent_spreads).
  reviewer:
    enabled: true
    model: claude-opus-4-7
    agent_id: null                # reuse an existing agent id, or null to create one on first use
    veto_enforced: false          # false = advisory only (log verdict, proceed); true = skip on VETO

  # Post-Mortem Journalist: end-of-day report on the day's trading. Run via
  # `python -m vantage_trader daily-report` (cron-friendly). Reads
  # `state/journal.jsonl` and writes `reports/YYYY-MM-DD.md`. Gets the full
  # managed-agents toolset (bash, python, file ops) so it can grind stats.
  journalist:
    enabled: true
    model: claude-opus-4-7
    agent_id: null
